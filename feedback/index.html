<body class="site-shell">
    <div class="site-page-bg site-page-bg-gradient"></div>
    <div class="site-page-bg site-page-bg-grid"></div>

    <script>window.VibeSailHeader.render('feedback');</script>

    <main class="site-page-shell feedback-page">
        <header class="feedback-hero">
            <p class="site-page-kicker">Community board</p>
            <h1 class="site-page-title">Feedback</h1>
            <p class="site-page-intro">Share an idea or report a problem. Everything posted here is public, so other sailors can vote on what matters most.</p>
        </header>

        <section class="site-page-panel feedback-compose is-collapsed" aria-labelledby="compose-toggle">
            <p id="compose-status" class="feedback-status" aria-live="polite"></p>
            <button id="compose-toggle" class="primary-button compose-toggle" type="button" disabled>
                Checking sign-in…
            </button>

            <div id="feedback-compose-panel" class="feedback-compose-panel" hidden>
                <div class="feedback-compose-header">
                    <h2 id="new-feedback-title">Post feedback</h2>
                    <button id="compose-cancel" class="compose-cancel" type="button">Cancel</button>
                </div>

                <form id="feedback-form" class="feedback-form" novalidate>
                    <label for="title-input">Title</label>
                    <input id="title-input" name="title" type="text" minlength="3" maxlength="120" placeholder="A short summary" required>

                    <label for="message-input">Details</label>
                    <textarea id="message-input" name="message" rows="6" minlength="10" maxlength="4000" placeholder="Explain the idea or problem…" required></textarea>

                    <p id="profile-name-notice" class="feedback-help" hidden></p>
                    <input id="name-input" name="display_name" type="hidden" value="">

                    <div id="turnstile-container" class="turnstile-wrap" hidden></div>
                    <p id="turnstile-help" class="feedback-help" hidden>Protected by Cloudflare Turnstile.</p>
                    <div id="submit-status" class="feedback-status" aria-live="polite"></div>
                    <button id="submit-button" class="primary-button" type="submit">Post feedback</button>
                </form>
            </div>
        </section>

        <section class="site-page-panel feedback-board" aria-labelledby="community-feedback-title">
            <div class="feedback-board-header">
                <div>
                    <h2 id="community-feedback-title">Community feedback</h2>
                    <p>Vote once per account. Click an active vote again to remove it.</p>
                </div>
                <div class="feedback-board-controls">
                    <div class="sort-control" role="group" aria-label="Filter feedback">
                        <button type="button" class="sort-button active" data-status="open">Open</button>
                        <button type="button" class="sort-button" data-status="done">Done</button>
                        <button type="button" class="sort-button" data-status="all">All</button>
                    </div>
                    <div class="sort-control" role="group" aria-label="Sort feedback">
                        <button type="button" class="sort-button active" data-sort="top">Top</button>
                        <button type="button" class="sort-button" data-sort="new">New</button>
                    </div>
                </div>
            </div>
            <div id="board-status" class="board-status" aria-live="polite">Loading feedback…</div>
            <div id="feedback-list" class="feedback-list"></div>
        </section>
    </main>
